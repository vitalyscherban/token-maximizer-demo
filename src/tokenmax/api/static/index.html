<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tokenmax - token efficiency console</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --ok:#3fb950; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px; background:var(--bg); color:var(--fg); font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 12px; }
  button { background:var(--accent); color:#0d1117; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:progress; }
  input { width:100%; padding:9px 11px; border-radius:6px; border:1px solid var(--line); background:#0d1117; color:var(--fg); margin-bottom:10px; }
  .stat { font-size:30px; font-weight:700; }
  .stat.ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre { white-space:pre-wrap; background:#0d1117; border:1px solid var(--line); border-radius:6px; padding:12px; max-height:280px; overflow:auto; font-size:12px; margin:0; }
  .bar { height:8px; border-radius:4px; background:#21262d; overflow:hidden; margin-top:6px; }
  .bar > span { display:block; height:100%; background:var(--ok); }
</style>
</head>
<body>
<h1>tokenmax</h1>
<p class="sub">Agentic reference architecture &mdash; every answer measured against a naive baseline.</p>

<div class="grid">
  <div class="card">
    <h2>A/B scenario</h2>
    <p class="sub" style="margin-bottom:12px">Replays a 4-turn conversation on a naive agent and an optimized agent.</p>
    <button id="run">Run comparison</button>
    <div id="compare" style="margin-top:16px"></div>
  </div>

  <div class="card">
    <h2>Live chat</h2>
    <input id="msg" placeholder="Ask about pricing, latency, security..." value="What are your pricing tiers?" />
    <button id="send">Send</button>
    <div id="chat" style="margin-top:16px"></div>
  </div>

  <div class="card">
    <h2>Active techniques</h2>
    <div id="techniques">loading&hellip;</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sessionId = "ui-" + Math.random().toString(36).slice(2, 10);

async function api(path, body) {
  const res = await fetch("/api" + path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  } : undefined);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function savingsBlock(saved, pct, naive, optimized) {
  return `<div class="stat ok">${pct}%</div>
    <div style="color:var(--dim)">${saved.toLocaleString()} tokens saved</div>
    <div class="bar"><span style="width:${Math.min(100, pct)}%"></span></div>
    <table style="margin-top:12px">
      <tr><th>Naive baseline</th><td class="num">${naive.toLocaleString()}</td></tr>
      <tr><th>Optimized</th><td class="num">${optimized.toLocaleString()}</td></tr>
    </table>`;
}

$("run").onclick = async () => {
  const btn = $("run"); btn.disabled = true; $("compare").innerHTML = "running&hellip;";
  try {
    const d = await api("/compare", {});
    const techniques = d.detail.optimized.report.by_technique;
    const rows = Object.entries(techniques)
      .filter(([, v]) => v.tokens_saved > 0)
      .map(([k, v]) => `<tr><th>${k}</th><td class="num">${v.tokens_saved.toLocaleString()}</td></tr>`)
      .join("") || `<tr><td colspan="2" style="color:var(--dim)">no savings recorded</td></tr>`;
    $("compare").innerHTML = savingsBlock(d.tokens_saved, d.savings_pct, d.naive_tokens, d.optimized_tokens)
      + `<h2 style="margin-top:18px">Attribution</h2><table>${rows}</table>`;
  } catch (e) { $("compare").innerHTML = `<pre>${e.message}</pre>`; }
  btn.disabled = false;
};

$("send").onclick = async () => {
  const btn = $("send"); btn.disabled = true; $("chat").innerHTML = "thinking&hellip;";
  try {
    const d = await api("/chat", { session_id: sessionId, message: $("msg").value });
    const steps = d.steps.map(s => `${s.index}. [${s.kind}${s.cached ? "/cached" : ""}] ${s.detail}`).join("\n");
    $("chat").innerHTML = `<pre>${d.answer}</pre>`
      + `<table style="margin-top:12px">
           <tr><th>Prompt tokens</th><td class="num">${d.usage.prompt_tokens}</td></tr>
           <tr><th>Completion tokens</th><td class="num">${d.usage.completion_tokens}</td></tr>
           <tr><th>Saved vs baseline</th><td class="num">${d.tokens_saved} (${d.savings_pct}%)</td></tr>
         </table><h2 style="margin-top:18px">Steps</h2><pre>${steps}</pre>`;
  } catch (e) { $("chat").innerHTML = `<pre>${e.message}</pre>`; }
  btn.disabled = false;
};

api("/techniques").then(d => {
  $("techniques").innerHTML = "<table>" + d.techniques.map(t =>
    `<tr><th>${t.name}</th><td class="num" style="color:${t.enabled ? "var(--ok)" : "var(--dim)"}">${t.enabled ? "on" : "off"}</td></tr>
     <tr><td colspan="2" style="color:var(--dim);border:0;padding-bottom:10px">${t.description}</td></tr>`
  ).join("") + "</table>";
});
</script>
</body>
</html>
